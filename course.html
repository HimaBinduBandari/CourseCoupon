<!DOCTYPE html>
<html>

<head>

<title>
Course Details - CourseCoupon
</title>


<meta name="viewport" content="width=device-width, initial-scale=1.0">


<link rel="stylesheet" href="assets/css/course.css">


</head>


<body>


<header class="course-header">

    <h1>
        Course Details
    </h1>

</header>



<main class="course-container">


<div id="courseDetails">


    <section class="course-main">


        <div class="course-image-box">


            <img 
            id="courseImage"
            src=""
            alt="Course Image">


        </div>



        <div class="course-info">


            <h1 id="courseTitle">
                Course Title
            </h1>



            <p 
            class="course-description-short"
            id="courseShortDescription">

            </p>




            <div class="course-meta">


                <div>

                    ⭐ Rating

                    <strong id="courseRating">
                    </strong>

                </div>



                <div>

                    ⏱ Duration

                    <strong id="courseDuration">
                    </strong>

                </div>



                <div>

                    🌐 Language

                    <strong id="courseLanguage">
                    </strong>

                </div>


            </div>




            <div class="course-actions">


                <a 
                id="courseButton"
                href="#"
                target="_blank">

                Get Course Coupon

                </a>


            </div>


        </div>


    </section>





    <section class="course-details-card">


        <h2>
            Course Information
        </h2>



        <div class="details-grid">


            <div>

                👨‍🏫 Trainer

                <strong id="courseTrainer">

                </strong>

            </div>



            <div>

                📂 Category

                <strong id="courseCategory">

                </strong>

            </div>



            <div>

                🎟 Coupon Code

                <strong id="courseCoupon">

                </strong>

            </div>



            <div>

                👥 Students

                <strong id="courseStudents">

                </strong>

            </div>



            <div>

                ⭐ Reviews

                <strong id="courseReviews">

                </strong>

            </div>



            <div>

                📅 Updated

                <strong id="courseUpdated">

                </strong>

            </div>


        </div>


    </section>





    <section class="course-description">


        <h2>
            About This Course
        </h2>


        <p id="courseDescription">

        </p>


    </section>






    <section class="related-section">


        <h2>
            Related Courses
        </h2>



        <div 
        id="relatedCourses"
        class="related-grid">


        </div>


    </section>



</div>


</main>



<script src="assets/js/course.js"></script>


</body>

</html>

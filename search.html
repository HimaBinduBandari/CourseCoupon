<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Search Courses - CourseCoupon

</title>

<link
rel="stylesheet"
href="assets/css/search.css">

</head>

<body>


<!--=====================================
    HEADER
======================================-->

<header class="main-header">

<div class="container header-container">

<div class="logo">

<a href="index.html">

CourseCoupon

</a>

</div>


<nav class="main-nav">

<a href="index.html">

Home

</a>

<a href="category.html">

Categories

</a>

<a href="trainer.html">

Trainers

</a>

<a href="language.html">

Languages

</a>

</nav>

</div>

</header>



<!--=====================================
    SEARCH HEADER
======================================-->

<section class="search-header">

<div class="container">

<h1>

Search Courses

</h1>

<p>

Find courses by Course Name or Trainer.

</p>

</div>

</section>



<!--=====================================
    SEARCH BAR
======================================-->

<section class="search-box-section">

<div class="container">

<div class="search-wrapper">


<select id="searchType">

<option value="course">

Course Name

</option>

<option value="trainer">

Trainer Name

</option>

</select>



<input

type="text"

id="searchKeyword"

placeholder="Search...">



<button
id="searchButton">

Search

</button>


</div>

</div>

</section>




<!--=====================================
    SEARCH INFO
======================================-->

<section class="result-info">

<div class="container">


<h2 id="resultTitle">

Search Results

</h2>


<p id="resultCount">

0 Courses Found

</p>


</div>

</section>




<!--=====================================
    RESULTS
======================================-->

<section class="results-section">

<div class="container">


<div

id="courseResults"

class="course-grid">


</div>


</div>

</section>




<!--=====================================
    FOOTER
======================================-->

<footer class="footer">

<div class="container">

<p>

© 2026 CourseCoupon

</p>

</div>

</footer>



<script src="assets/js/search.js"></script>

</body>

</html>

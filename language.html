<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Languages | CourseCoupon

</title>

<meta

name="description"

content="Discover the most popular Udemy learning topics with free coupons, expert instructors and top-rated courses.">

<meta
property="og:title"
content="Languages Topics | CourseCoupon">

<meta
property="og:description"
content="Browse trending learning topics including AI, Programming, Business, Design, Marketing and more.">

<meta
property="og:image"
content="assets/images/og-image.jpg">

<meta
property="og:url"
content="">

<link
rel="canonical"
id="canonicalLink"
href="">

<link
rel="stylesheet"
href="assets/css/style.css">

<link
rel="stylesheet"
href="assets/css/home.css">

<link
rel="stylesheet"
href="assets/css/trending-topics.css">

</head>

<body>

<!--====================================
HEADER
=====================================-->

<div id="header"></div>

<!--====================================
HERO
=====================================-->

<!--=====================================================
    LANGUAGE HEADER
======================================================-->

<header class="language-header">

    <div class="container">

        <div class="row align-items-center">

            <div class="col-lg-8">

                <span class="badge bg-info text-dark mb-3">

                    Browse by Language

                </span>

                <h1 id="languageName">

                    Loading...

                </h1>

                <p id="languageDescription">

                    Loading language...

                </p>

            </div>

            <div class="col-lg-4 text-center">

                <img
                    id="languageImage"
                    src=""
                    alt=""
                    class="img-fluid language-image">

            </div>

        </div>

    </div>

</header>

<!--=====================================================
    STATISTICS
======================================================-->

<section class="py-5">

    <div class="container">

        <div class="row g-4">

            <div class="col-lg-3 col-md-6">

                <div class="stat-card">

                    <i class="bi bi-book"></i>

                    <h2 id="totalCourses">0</h2>

                    <p>Total Courses</p>

                </div>

            </div>

            <div class="col-lg-3 col-md-6">

                <div class="stat-card">

                    <i class="bi bi-people"></i>

                    <h2 id="totalTrainers">0</h2>

                    <p>Trainers</p>

                </div>

            </div>

            <div class="col-lg-3 col-md-6">

                <div class="stat-card">

                    <i class="bi bi-folder"></i>

                    <h2 id="totalCategories">0</h2>

                    <p>Categories</p>

                </div>

            </div>

            <div class="col-lg-3 col-md-6">

                <div class="stat-card">

                    <i class="bi bi-star-fill"></i>

                    <h2 id="averageRating">0</h2>

                    <p>Average Rating</p>

                </div>

            </div>

        </div>

    </div>

</section>
<!--=====================================================
    SEARCH & SORT
======================================================-->

<section class="pb-4">

    <div class="container">

        <div class="row g-3 align-items-center">

            <div class="col-lg-8">

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-search"></i>

                    </span>

                    <input
                        type="text"
                        id="searchCourse"
                        class="form-control"
                        placeholder="Search courses...">

                </div>

            </div>


            <div class="col-lg-4">

                <select
                    id="sortCourses"
                    class="form-select">


                    <option value="default">

                        Sort Courses

                    </option>


                    <option value="rating">

                        Highest Rating

                    </option>


                    <option value="title">

                        A - Z

                    </option>


                    <option value="duration">

                        Longest Duration

                    </option>


                </select>

            </div>


        </div>

    </div>

</section>


<!--=====================================================
    COURSE SECTION
======================================================-->

<section class="pb-5">

    <div class="container">


        <!-- Loading -->

        <div
            id="loadingCourses"
            class="text-center py-5">


            <div
                class="spinner-border text-primary"
                role="status">


            </div>


            <p class="mt-3">

                Loading Courses...

            </p>


        </div>



        <!-- No Courses -->

        <div
            id="noCourses"
            class="text-center py-5 d-none">


            <i
                class="bi bi-folder-x display-1 text-secondary">


            </i>


            <h3 class="mt-4">

                No Courses Found

            </h3>


            <p class="text-muted">

                Try another search.

            </p>


        </div>



        <!-- Course Cards -->

        <div
            class="row g-4"
            id="courseContainer">


        </div>


    </div>


</section>



<!--=====================================================
    COURSE TEMPLATE
======================================================-->

<template id="courseTemplate">


    <div class="col-lg-4 col-md-6">


        <div class="card course-card h-100">


            <img
                class="course-image"
                src=""
                alt="Course Image">



            <div class="card-body d-flex flex-column">



                <span
                    class="badge bg-info text-dark language-badge">


                </span>



                <h5
                    class="course-title mt-3">


                </h5>



                <p
                    class="course-description">


                </p>



                <div
                    class="d-flex justify-content-between align-items-center mt-auto mb-3">


                    <span>

                        ⭐

                        <span class="course-rating">

                        </span>


                    </span>



                    <span>

                        ⏱

                        <span class="course-duration">

                        </span>


                    </span>



                </div>




                <a
                    href="#"
                    class="btn btn-primary course-button">


                    Get Course


                </a>



            </div>


        </div>


    </div>


</template>

<!--====================================
FOOTER
=====================================-->

<div id="footer"></div>

<script src="assets/js/common.js"></script>

<script src="assets/js/trending-topics.js"></script>

</body>

</html>

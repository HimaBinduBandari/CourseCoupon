name: Generate Sitemap

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "tools/generate-sitemap.js"
  schedule:
    # Also run weekly, in case lastmod dates should refresh even
    # without a data change.
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate sitemap.xml
        run: node tools/generate-sitemap.js

      - name: Commit sitemap if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes to sitemap.xml"
          else
            git commit -m "chore: regenerate sitemap.xml [automated]"
            git push
          fi

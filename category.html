<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Category Courses | CourseCoupon
</title>

<meta
name="description"
content="">

<meta
property="og:title"
content="">

<meta
property="og:description"
content="">

<meta
property="og:image"
content="">

<meta
property="og:url"
content="">

<link
rel="canonical"
id="canonicalLink"
href="">

<link
rel="stylesheet"
href="assets/css/style.css">

<link
rel="stylesheet"
href="assets/css/home.css">

<link
rel="stylesheet"
href="assets/css/category.css">

</head>

<body>

<!--====================================
HEADER
=====================================-->

<div id="header"></div>


<!--====================================
CATEGORY HERO
=====================================-->

<section class="category-hero">

<div class="container">

<div class="category-card">


<div class="category-icon"

id="categoryIcon">

📚

</div>


<h1 id="categoryName">

Loading...

</h1>


<p
class="category-description"
id="categoryDescription">

Loading category...

</p>


<div class="category-stats">

<div class="stat-card">

<div class="stat-icon">

⭐

</div>

<div
class="stat-number"
id="avgRating">

0.0

</div>

<div class="stat-title">

Average Rating

</div>

</div>


<div class="stat-card">

<div class="stat-icon">

📚

</div>

<div
class="stat-number"
id="courseCount">

0

</div>

<div class="stat-title">

Courses

</div>

</div>


<div class="stat-card">

<div class="stat-icon">

👨‍🏫

</div>

<div
class="stat-number"
id="trainerCount">

0

</div>

<div class="stat-title">

Trainers

</div>

</div>


<div class="stat-card">

<div class="stat-icon">

👨‍🎓

</div>

<div
class="stat-number"
id="studentCount">

0

</div>

<div class="stat-title">

Students

</div>

</div>

</div>

</div>

</div>

</section>



<!--====================================
SEARCH & SORT
=====================================-->

<section class="toolbar-section">

<div class="container">

<div class="toolbar">

<input

type="text"

id="courseSearch"

placeholder="Search courses in this category...">


<select id="sortCourses">

<option value="latest">

Latest Courses

</option>

<option value="rating">

Highest Rated

</option>

<option value="students">

Most Students

</option>

<option value="reviews">

Most Reviews

</option>

<option value="name">

Course Name (A-Z)

</option>

</select>

</div>

</div>

</section>



<!--====================================
COURSES
=====================================-->

<section class="courses-section">

<div class="container">

<h2 class="section-title">

Latest

<span id="categoryTitle">

Courses

</span>

</h2>


<div

id="courseGrid"

class="course-grid">

</div>

</div>

</section>



<!--====================================
PAGINATION
=====================================-->

<section class="pagination-section">

<div class="container">

<div

id="pagination"

class="pagination">

</div>

</div>

</section>



<!--====================================
POPULAR TRAINERS
=====================================-->

<section class="popular-trainers">

<div class="container">

<h2>

Top Trainers

</h2>

<div

id="trainerGrid"

class="trainer-grid">

</div>

</div>

</section>



<!--====================================
RELATED CATEGORIES
=====================================-->

<section class="related-categories">

<div class="container">

<h2>

Related Categories

</h2>

<div

id="relatedCategories"

class="related-grid">

</div>

</div>

</section>



<!--====================================
SEO CONTENT
=====================================-->

<section class="seo-section">

<div class="container">

<div class="seo-content">

<h2>

About

<span id="seoCategoryName">

Category

</span>

Courses

</h2>


<p

id="seoContent">

</p>

</div>

</div>

</section>



<!--====================================
FOOTER
=====================================-->

<div id="footer"></div>



<script src="assets/js/common.js"></script>

<script src="assets/js/course-card.js"></script>

<script src="assets/js/category.js"></script>

</html>
